name: "UZ Train Delay Monitor"
description: "Моніторинг затримок приміських поїздів УЗ"
version: "1.0.3"
slug: "uz_delay_monitor"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

startup: application
boot: auto

options:
  channel_username: "UZprymisky"
  check_interval_seconds: 30
  mqtt_broker: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_topic_prefix: "uz/train_delay"
  train_schedules:
    - train_id: "6702/6701"
      schedule: "8:44 -> 10:00"
    - train_id: "6704/6703"
      schedule: "12:52 -> 13:43"
    - train_id: "6705"
      schedule: "17:44 -> 19:40"
    - train_id: "6723"
      schedule: "17:10 -> 19:05"

schema:
  channel_username: str
  check_interval_seconds: int
  mqtt_broker: str
  mqtt_port: int
  mqtt_user: str?
  mqtt_password: password?
  mqtt_topic_prefix: str
  train_schedules:
    - train_id: str
      schedule: str
