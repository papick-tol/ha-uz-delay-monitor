name: "UZ Train Delay Monitor"
description: "Моніторинг затримок поїздів з Telegram-каналу UZprymisky"
version: "1.1.0"
slug: "uz_delay_monitor"
url: "https://github.com/your-username/uz-delay-monitor-addon"
init: false
arch:
  - aarch64
  - amd64
  - armv7
services:
  - mqtt:need
schema:
  channel_username: str
  check_interval_seconds: int
  tg_bot_token: password
  tg_chat_ids:
    - int
  mqtt_topic_prefix: str
  train_schedules:
    - train_id: str
      schedule: str
options:
  channel_username: "UZprymisky"
  check_interval_seconds: 30
  tg_bot_token: ""
  tg_chat_ids: []
  mqtt_topic_prefix: "uz/train_delay"
  train_schedules:
    - train_id: "6702/6701"
      schedule: "8:44 -> 10:00"
    - train_id: "6704/6703"
      schedule: "12:52 -> 13:43"
